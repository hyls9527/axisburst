<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AxisBurst 轴爆 · 机械零件线稿装配分解</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<p data-aigc-mark="1" style="margin:0;font-size:10px;line-height:1.3;color:#a7a49b;font-weight:400;">AI生成</p>

  <div class="app">
    <header class="masthead">
      <h1>The complete<br />assembly toolkit</h1>
      <p>Blender 出分层线稿 SVG，anime.js v4 排装配时序。<br />一个零件一个图层，一套时间轴拆到底。</p>
    </header>

    <div class="drawing" id="drawing" aria-label="机械装配体线稿"></div>

    <ol class="keywords" id="keywords"></ol>

    <div class="readout" id="readout"></div>

    <footer class="controls">
      <button type="button" id="btn-play" class="btn primary">暂停</button>
      <button type="button" id="btn-restart" class="btn">重播</button>
      <label class="speed">
        <span>速度</span>
        <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" />
        <span class="mono" id="speed-val">1.0×</span>
      </label>
      <span class="mono phase" id="phase"></span>
      <span class="mono clock" id="clock">0.00s</span>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
